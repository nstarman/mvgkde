ci:
  autoupdate_schedule: "quarterly"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  # pre-commit.ci runs every hook over every file on Linux and pushes fixes. The graph
  # is only reproducible from a fresh clone, so the commit hook is the one place it is rebuilt.
  skip: [graphify-update]

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.1
    hooks:
      - id: commitizen
      # - id: commitizen-branch
      #   stages: [push]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2026.08.14
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        exclude: ^graphify-out/graph\.json$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^graphify-out/graph\.json$
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--pattern", "^versions/.*"]
        always_run: true
        # Restrict to pre-commit so a push (e.g. a release tag) isn't mistaken for a commit.
        stages: [pre-commit]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.9"
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.4.0"
    hooks:
      - id: mypy
        files: src

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell
        exclude: "uv.lock|^graphify-out/graph\\.json$"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml

      # Keeps the committed code graph (graphify-out/graph.json) in step with the code.
      # Like a formatter: if the graph changed, stage it and commit again.
      # Skip once with `SKIP=graphify-update git commit ...`.
      # This is the only place the graphify release is pinned; the weekly workflow
      # .github/workflows/graphify.yml reads the version back out of this file.
      - id: graphify-update
        name: graphify update
        language: python
        additional_dependencies: ["graphifyy==0.9.119"]
        entry: env PYTHONHASHSEED=0 graphify update . --force
        pass_filenames: false
        always_run: true
        # default_stages includes pre-push; a second full rebuild on push can only repeat this one.
        stages: [pre-commit]
