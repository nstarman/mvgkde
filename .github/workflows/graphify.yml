name: Refresh code graph

# Rebuilds graphify-out/graph.json and opens a pull request if it drifted from the code, e.g.
# because someone committed with SKIP=graphify-update. Never pushes to the default branch: the
# graph is code-derived, but a bad rebuild is still a change nobody reviewed.
#
# This runs on Linux, and the graph is not byte-reproducible across platforms: the same source and
# pin give a few fewer __init__.py re-export edges here than on macOS. So a run after a commit from
# another platform opens a pull request that only normalises those edges. That is the job working,
# not a bug; merging it makes the committed graph this runner's flavour until the next such commit.
#
# Under a fresh checkout the build also differs from one in a working environment: a generated
# src/mvgkde/_version.py is enough to move community numbering. A contributor who has installed the
# package therefore commits a graph this job later normalises back, so a pull request here is
# common, not exceptional.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild graph
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # github.token is read-only here and Actions may not open pull requests, so the pull
      # request is opened with a GitHub App token. The App needs "Contents: Read and write" and
      # "Pull requests: Read and write", and its credentials live in the repository secrets
      # GRAPHIFY_APP_ID and GRAPHIFY_APP_PRIVATE_KEY.
      #
      # Those secrets do not exist yet, so until they do this job fails at this step. That is
      # deliberate: a weekly failure is the signal that drift is not being watched, which a guard
      # on the secret would hide.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.GRAPHIFY_APP_ID }}
          private-key: ${{ secrets.GRAPHIFY_APP_PRIVATE_KEY }}
          # Narrow the token to what create-pull-request needs (zizmor's github-app audit).
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The version is pinned once, in .pre-commit-config.yaml, so this job clusters the graph
      # exactly the way the commit hook does.
      - name: Rebuild graph
        run: |
          # Require at least one digit and take the first hit, so a mention of the package in a
          # comment cannot be picked up as a second "pin".
          pin=$(grep -oE 'graphifyy==[0-9]+(\.[0-9]+)*' .pre-commit-config.yaml | head -1)
          if [ -z "$pin" ]; then
            echo "::error::no graphifyy== pin found in .pre-commit-config.yaml"
            exit 1
          fi
          echo "Rebuilding with $pin"
          PYTHONHASHSEED=0 uvx --from "$pin" graphify update . --force

      # A rebuild on one platform is byte-for-byte reproducible from a fresh checkout:
      # .graphifyignore pins what is indexed, PYTHONHASHSEED=0 pins community numbering, and
      # update keeps the stored built_at_commit rather than rewriting it. So a plain diff is a
      # true drift check.
      - name: Check for drift
        id: drift
        run: |
          if git diff --quiet -- graphify-out/graph.json; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "The committed graph matches a fresh rebuild."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "The committed graph has drifted from the code."
          fi

      - name: Open pull request
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The default branch requires signed commits. Without this the action pushes with plain
          # git, the commit is unsigned, and the pull request can only be merged with an
          # administrator override. This commits through the GitHub API so GitHub signs it, and
          # attributes it to the app, which also clears the unattributed-changes rule.
          sign-commits: true
          add-paths: graphify-out/graph.json
          commit-message: "chore(graph): refresh the committed code graph"
          title: "chore(graph): refresh the committed code graph"
          body: |
            Rebuild of `graphify-out/graph.json`. Either the committed graph drifted from the code,
            or it was last built on a different operating system or in a working environment —
            graphify extracts a few edges differently per platform, and a generated file such as
            `_version.py` moves community numbering, so a rebuild here moves the graph to this
            runner's flavour.

            Generated output, one line, collapsed by GitHub. Nothing to review beyond a green build.
          branch: chore/refresh-graphify
          delete-branch: true
